<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; font-size: 10px; padding: 10px; }
        .success { color: #00ffff; }
        .warning { color: #ffff00; }
        .danger { color: #ff0000; }
    </style>
</head>
<body>
    <div id="output"></div>
    <script>
        const log = document.getElementById('output');
        function add(msg) {
            log.innerHTML = `> ${msg}<br>` + log.innerHTML;
            if (log.children.length > 20) log.lastElementChild.remove();
        }

        setInterval(() => {
            const hex = () => Math.floor(Math.random()*16777215).toString(16).toUpperCase();
            const types = ["UDP_HANDSHAKE", "DATA_SYNC", "KEEP_ALIVE", "ACK_RECV"];
            const t = types[Math.floor(Math.random()*types.length)];
            
            if(Math.random() > 0.85) {
                add(`<span class='danger'>[!] CRITICAL: Server-Side Sync Conflict at 0x${hex()}</span>`);
            } else {
                add(`Injecting <span class='success'>${t}</span> | Offset: 0x${hex()} | TTL: 64ms | Status: <span class='success'>ENCRYPTED</span>`);
            }
        }, 400);
    </script>
</body>
</html>
